[package]
name = "homesmart-cam-proto"
version = "0.1.0"
edition = "2021"
description = "Protocole entre HomeSmart et une caméra HomeSmart (caméra à fabriquer soi-même)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Appairage par code sans le faire circuler (PAKE) : RustCrypto, MIT / Apache-2.0.
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
serde_json = "1"
